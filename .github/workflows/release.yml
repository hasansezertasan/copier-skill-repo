name: Release

# Never remove `workflow_dispatch`: it is the manual way to re-run the release
# after a failure.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release Please
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the tag and the GitHub release
      issues: write # release-please manages PR labels through the Issues API
      pull-requests: write
      statuses: write # reports the two lint checks the release PR cannot trigger
    steps:
      # Runs with the implicit GITHUB_TOKEN, as the generated repos do: a PAT or
      # App token would be a standing credential with write access to main.
      # ci.yml runs on the release PR, but the two lint workflows use
      # `pull_request_target`, which an event made by GITHUB_TOKEN does not fire,
      # so the next step reports them. The repository setting "Allow GitHub
      # Actions to create and approve pull requests" must be on. The tag it
      # creates (v0.1.0, ...) is what `copier update` resolves against.
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
      # `main` requires "Validate branch name" and "Validate PR title", which
      # check-branch-name.yml and check-pr-title.yml report on `pull_request_target`.
      # Neither runs for a PR that GITHUB_TOKEN opened, so the release PR would sit at
      # "Expected" until someone closed and reopened it. A commit status with the same
      # name satisfies the requirement. Post it only for a PR whose branch and title
      # are the ones release-please generates; any other PR gets the real lint.
      - name: Report the lint checks on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch_pattern='^release-please--[a-z0-9-]+$'
          title_pattern='^chore(\([a-z0-9-]+\))?: release( [a-z0-9._-]+)? [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          jq -c '.[]' <<<"$PRS" | while read -r pr; do
            number=$(jq -r '.number' <<<"$pr")
            branch=$(jq -r '.headBranchName' <<<"$pr")
            title=$(jq -r '.title' <<<"$pr")
            if [[ ! "$branch" =~ $branch_pattern || ! "$title" =~ $title_pattern ]]; then
              echo "::warning::PR #${number} is not a generated release PR; its lint checks are left to the lint workflows"
              continue
            fi
            sha=$(gh pr view "$number" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            for context in "Validate branch name" "Validate PR title"; do
              gh api "repos/${REPO}/statuses/${sha}" \
                -f state=success \
                -f context="$context" \
                -f description="Generated by release-please" \
                >/dev/null
              echo "Reported \"${context}\" on PR #${number} (${sha:0:7})"
            done
          done
