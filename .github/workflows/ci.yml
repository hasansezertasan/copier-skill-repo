name: CI

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same job before it releases.
on:
  push:
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Copier is a Python tool; requirements.txt pins it where Renovate reads it.
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The template's own hardening rules also apply to this repo's workflows.
      - run: node template/scripts/check-repo.mjs
      # Renders every matrix entry (defaults, publish off, non-default placeholder
      # skill) and runs the update test; any failure fails the job.
      - run: npm test
