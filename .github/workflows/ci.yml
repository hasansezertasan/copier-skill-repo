name: CI

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same job before it releases.
on:
  push:
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs node, uv and copier as pinned in mise.toml.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      # The template's own hardening rules also apply to this repo's workflows.
      - run: node template/scripts/check-repo.mjs
      # Renders every matrix entry (defaults, publish off, non-default placeholder
      # skill) and runs the update test; any failure fails the job.
      - run: npm test
