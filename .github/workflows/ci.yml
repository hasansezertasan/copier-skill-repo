name: CI

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same job before it releases.
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs node, python and uv as pinned in .config/mise.toml.
      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      # The template's own hardening rules also apply to this repo's workflows.
      - name: Check the workflows
        run: node template/scripts/check-repo.mjs
      # The pytest suite in tests/ renders every answer set it covers (defaults,
      # publish off, non-default answers, rejected answers) and runs the update
      # tests; any failure fails the job.
      - name: Run the tests
        run: mise run test
